name: "$(Build.DefinitionName) #$(Build.BuildId)"

trigger: none # Manual Publish
pr: none # GitHub Actions handle PRs

pool:
  vmImage: windows-latest

resources:
  repositories:
    - repository: self
      type: git

parameters:
  # Projects to pack and publish. Add an Admin UI project here when the repository has one.
  - name: artifacts
    type: object
    default:
      - artifactName: "Kentico-Xperience-RepoTemplate"
        projectPath: "src/Kentico.Xperience.RepoTemplate"

variables:
  - name: SIGN_FILE
    value: true

stages:
  - stage: Build
    jobs:
      - job: Build
        displayName: Build, Sign, Test & Pack

        variables:
          - group: Code Sign KV Auth

          - name: Configuration
            value: Release

          - name: SIGN_FILE
            value: true

          - name: slnPath
            value: src/Kentico.Xperience.RepoTemplate.Libs.slnx

        steps:
          - task: UseDotNet@2
            inputs:
              useGlobalJson: true

          - task: PowerShell@2
            displayName: Set Node.js version from Admin client package.json (if present)
            inputs:
              targetType: inline
              script: |
                $packageJson = Get-ChildItem -Path 'src' -Recurse -Filter package.json -Depth 2 |
                  Where-Object { $_.FullName -match '[\\/]Client[\\/]package\.json$' } |
                  Select-Object -First 1
                if (-not $packageJson) {
                  Write-Host "No Admin client package.json found - skipping Node.js setup."
                  Write-Host "##vso[task.setvariable variable=NEEDS_NODE]false"
                  exit 0
                }
                $enginesNode = (Get-Content -Path $packageJson.FullName -Raw | ConvertFrom-Json).engines.node
                Write-Host "Required Node version $enginesNode"
                Write-Host "##vso[task.setvariable variable=NEEDS_NODE]true"
                Write-Host "##vso[task.setvariable variable=PACKAGE_JSON_NODE_VERSION]$enginesNode"

          - task: UseNode@1
            displayName: "Install Node.js from package.json version"
            condition: and(succeeded(), eq(variables['NEEDS_NODE'], 'true'))
            inputs:
              version: $(PACKAGE_JSON_NODE_VERSION)

          - task: DotNetCoreCLI@2
            displayName: Restore dotnet tools
            inputs:
              command: custom
              custom: tool
              arguments: restore
              workingDirectory: $(System.DefaultWorkingDirectory)

          # 'custom' keeps the repository nuget.config (and its package source mapping) in effect.
          # The built-in 'restore' command with feedsToUse: select generates its own NuGet.config instead.
          - task: DotNetCoreCLI@2
            displayName: Restore dependencies
            inputs:
              command: custom
              custom: restore
              arguments: ${{ variables.slnPath }} --locked-mode


          - task: GetAzureAuthToken@5
            name: KeyVaultToken
            displayName: Get token to code signing certificate
            inputs:
              ServiceConnection: Code signer
              AccessScopes: https://vault.azure.net/.default

          - task: DotNetCoreCLI@2
            displayName: Build
            inputs:
              command: build
              projects: ${{ variables.slnPath }}
              configuration: ${{ variables.Configuration }}
              arguments: --no-restore
            env:
              AuthenticodeAccessToken: $(KeyVaultToken.AuthToken)
              # Roll-forward behavior set for AzureSignTool dotnet tool (see .config\dotnet-tools.json) which requires .Net 6.0 runtime
              DOTNET_ROLL_FORWARD: Major

          - template: steps.yml
            parameters:
              Configuration: $(Configuration)
              artifacts: ${{ parameters.artifacts }}

  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
      - stage: PublishNuGetPackages
        displayName: Publish NuGet packages
        dependsOn: Build

        jobs:
          - deployment: PublishNuGetPackages
            displayName: Publish NuGet packages

            environment: integrations-release-nuget
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: none

                    - task: NuGetToolInstaller@1
                      displayName: Install latest nuget.exe
                      inputs:
                        versionSpec: ">=5.6"
                        checkLatest: true

                    - task: NuGetAuthenticate@1
                      displayName: NuGet Authenticate

                    - task: NuGetCommand@2
                      displayName: NuGet push
                      inputs:
                        command: push
                        packagesToPush: $(Pipeline.Workspace)/**/*.nupkg
                        nuGetFeedType: external
                        publishFeedCredentials: nuget.org
                        allowPackageConflicts: true
