name: "CI: Build and Test"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh

    env:
      ASPNETCORE_ENVIRONMENT: CI
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install dependencies
        run: |
          dotnet restore Kentico.Xperience.RepoTemplate.slnx `
            --locked-mode

      - name: Verify lock files are committed
        shell: bash
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- '**/packages.lock.json')" ]; then
            echo "packages.lock.json files are missing or outdated - run dotnet restore and commit them."
            git status --porcelain --untracked-files=all -- '**/packages.lock.json'
            exit 1
          fi

      - name: Build Solution
        run: |
          dotnet build Kentico.Xperience.RepoTemplate.slnx `
            --configuration Release `
            --no-restore

      - name: Test Solution
        run: |
          dotnet test Kentico.Xperience.RepoTemplate.slnx `
            --configuration Release `
            --no-build `
            --no-restore
