name: "CI: Build and Test"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dotnet-format:
    name: .Net Format Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore Kentico.Xperience.RepoTemplate.slnx --locked-mode

      - name: Run dotnet format
        run: dotnet format Kentico.Xperience.RepoTemplate.slnx --no-restore --verify-no-changes

  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: dotnet-format
    defaults:
      run:
        shell: pwsh

    env:
      ASPNETCORE_ENVIRONMENT: CI
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Kentico.Xperience.RepoTemplate.Admin/Client/package-lock.json

      - name: Install dependencies
        run: |
          dotnet restore `
            --locked-mode

      # Release build runs npm ci and npm run build for the admin client
      - name: Build Solution
        run: |
          dotnet build `
            --configuration Release `
            --no-restore

      - name: Type-check admin client
        working-directory: src/Kentico.Xperience.RepoTemplate.Admin/Client
        run: npm run typecheck

      - name: Test Solution
        run: |
          dotnet test `
            --configuration Release `
            --no-build `
            --no-restore

  # Template repository only. Removed by the setup-repo skill.
  template_smoke:
    name: Template Smoke (${{ matrix.family }})
    if: github.repository == 'Kentico/repo-template'
    runs-on: ubuntu-latest
    needs: dotnet-format
    defaults:
      run:
        shell: pwsh

    strategy:
      fail-fast: false
      matrix:
        include:
          - family: Kentico
            name: SmokeTest
          - family: Labs
            name: SmokeTest
          - family: Community
            name: SmokeTest
            org: smoke-org
          - family: Example
            name: SmokeTest

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Kentico.Xperience.RepoTemplate.Admin/Client/package-lock.json

      - name: Rename template
        run: |
          $params = @{ Family = '${{ matrix.family }}'; Name = '${{ matrix.name }}' }
          if ('${{ matrix.org }}') { $params.GitHubOrg = '${{ matrix.org }}' }
          ./.claude/skills/setup-repo/scripts/Rename-Template.ps1 @params

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --no-restore
