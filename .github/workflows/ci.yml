name: "CI: Build and Test"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dotnet-format:
    name: .Net Format Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore Kentico.Xperience.RepoTemplate.slnx --locked-mode

      - name: Run dotnet format
        run: dotnet format Kentico.Xperience.RepoTemplate.slnx --no-restore --verify-no-changes

  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: dotnet-format
    defaults:
      run:
        shell: pwsh

    env:
      ASPNETCORE_ENVIRONMENT: CI
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Kentico.Xperience.RepoTemplate.Admin/Client/package-lock.json

      - name: Install dependencies
        run: |
          dotnet restore `
            --locked-mode

      # Release build runs npm ci and npm run build for the admin client
      - name: Build Solution
        run: |
          dotnet build `
            --configuration Release `
            --no-restore

      - name: Type-check admin client
        working-directory: src/Kentico.Xperience.RepoTemplate.Admin/Client
        run: npm run typecheck

      - name: Test Solution
        run: |
          dotnet test `
            --configuration Release `
            --no-build `
            --no-restore

  # Needs an Xperience license (XPERIENCE_LICENSE_KEY repository secret, and the same
  # Dependabot secret for Dependabot PRs). Without it - e.g. PRs from forks - every
  # step after checkout is skipped and the job passes.
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: dotnet-format
    defaults:
      run:
        shell: pwsh

    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Pass@12345
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Pass@12345 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

    env:
      ASPNETCORE_ENVIRONMENT: CI
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1
      HAS_LICENSE: ${{ secrets.XPERIENCE_LICENSE_KEY != '' }}
      DANCING_GOAT_BASE_URL: http://localhost:5080
      # Xperience's command-line parser rejects --urls, so Kestrel's address comes from ASPNETCORE_URLS
      ASPNETCORE_URLS: http://localhost:5080
      E2E_WEB_SERVER_COMMAND: dotnet run --project ../../examples/DancingGoat --configuration Release --no-build --no-launch-profile

    steps:
      - uses: actions/checkout@v7

      - name: Skip without license
        if: env.HAS_LICENSE != 'true'
        run: Write-Host "::notice title=E2E skipped::XPERIENCE_LICENSE_KEY is not available to this run."

      - name: Setup .NET
        if: env.HAS_LICENSE == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        if: env.HAS_LICENSE == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            src/Kentico.Xperience.RepoTemplate.Admin/Client/package-lock.json
            tests/e2e/package-lock.json

      - name: Create database
        if: env.HAS_LICENSE == 'true'
        env:
          XPERIENCE_LICENSE_KEY: ${{ secrets.XPERIENCE_LICENSE_KEY }}
        run: |
          $license = Join-Path $env:RUNNER_TEMP 'xperience-license.txt'
          Set-Content $license $env:XPERIENCE_LICENSE_KEY -NoNewline
          ./scripts/Initialize-Database.ps1 -LicenseFile $license
          Remove-Item $license

      # Release build embeds the admin client (npm ci + npm run build)
      - name: Build
        if: env.HAS_LICENSE == 'true'
        run: |
          dotnet restore --locked-mode
          dotnet build --configuration Release --no-restore

      - name: Install Playwright
        if: env.HAS_LICENSE == 'true'
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Type-check e2e tests
        if: env.HAS_LICENSE == 'true'
        working-directory: tests/e2e
        run: npm run typecheck

      - name: Run e2e tests
        if: env.HAS_LICENSE == 'true'
        working-directory: tests/e2e
        run: npm test

      - name: Upload Playwright report
        if: always() && env.HAS_LICENSE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 14

  # Template repository only. Removed by the setup-repo skill.
  template_smoke:
    name: Template Smoke (${{ matrix.family }}${{ matrix.example && ' example' || '' }})
    if: github.repository == 'Kentico/repo-template'
    runs-on: ubuntu-latest
    needs: dotnet-format
    defaults:
      run:
        shell: pwsh

    strategy:
      fail-fast: false
      matrix:
        include:
          - family: Kentico
            name: SmokeTest
          - family: Labs
            name: SmokeTest
          - family: Community
            name: SmokeTest
            org: smoke-org
          - family: Labs
            name: SmokeTest
            example: true

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Kentico.Xperience.RepoTemplate.Admin/Client/package-lock.json

      - name: Rename template
        run: |
          $params = @{ Family = '${{ matrix.family }}'; Name = '${{ matrix.name }}' }
          if ('${{ matrix.org }}') { $params.GitHubOrg = '${{ matrix.org }}' }
          if ('${{ matrix.example }}' -eq 'true') { $params.Example = $true }
          ./.claude/skills/setup-repo/scripts/Rename-Template.ps1 @params

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --no-restore
