# Template repository only: setup-repo (Rename-Template.ps1) deletes this file.
# Renames the template for each family, then restores, builds, and tests the result.
name: "Template Smoke"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  template_smoke:
    name: Template Smoke (${{ matrix.family }}${{ matrix.example && ' example' || '' }})
    if: github.repository == 'Kentico/repo-template'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh

    strategy:
      fail-fast: false
      matrix:
        include:
          - family: Kentico
            name: SmokeTest
          - family: Labs
            name: SmokeTest
          - family: Community
            name: SmokeTest
            org: smoke-org
          - family: Labs
            name: SmokeTest
            example: true

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Kentico.Xperience.RepoTemplate.Admin/Client/package-lock.json

      - name: Rename template
        run: |
          $params = @{ Family = '${{ matrix.family }}'; Name = '${{ matrix.name }}' }
          if ('${{ matrix.org }}') { $params.GitHubOrg = '${{ matrix.org }}' }
          if ('${{ matrix.example }}' -eq 'true') { $params.Example = $true }
          ./.claude/skills/setup-repo/scripts/Rename-Template.ps1 @params

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --no-restore
